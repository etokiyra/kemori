[package]
# Kemori is published as `kemori`; the installed binary is `kemori`.
name = "kemori"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Kiyra <kiyrai@proton.me>"]
description = "Kemori: a zero-configuration, terminal-native IDE"
license = "MPL-2.0"
repository = "https://github.com/etokiyra/kemori"
homepage = "https://github.com/etokiyra/kemori"
documentation = "https://docs.rs/kemori"
readme = "README.md"
keywords = ["ide", "tui", "editor", "lsp", "terminal"]
categories = ["command-line-utilities", "development-tools", "text-editors"]
default-run = "kemori"

[lib]
name = "kemori"
path = "src/lib.rs"

[[bin]]
name = "kemori"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
ropey = "1.6.1"
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Debian/Ubuntu package (cargo deb). The binary is still `kemori`; the package is
# named `kemori` so `apt install kemori` and `sudo kemori` are unsurprising.
[package.metadata.deb]
name = "kemori"
maintainer = "Kiyra <kiyrai@proton.me>"
copyright = "2026, Kemori contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Kemori is a terminal-native IDE: it detects a project's languages, provisions
the language servers it needs, and provides editing, search, git integration
and language intelligence without a configuration file."""
section = "editors"
priority = "optional"
depends = "libc6 (>= 2.35), libgcc-s1"
recommends = ["git", "curl"]
suggests = ["unzip", "gnupg"]
assets = [
    ["target/release/kemori", "usr/bin/kemori", "755"],
    ["LICENSE", "usr/share/doc/kemori/LICENSE", "644"],
    ["README.md", "usr/share/doc/kemori/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/kemori/CHANGELOG.md", "644"],
    ["SECURITY.md", "usr/share/doc/kemori/SECURITY.md", "644"],
    ["docs/*.md", "usr/share/doc/kemori/docs/", "644"],
]

# RPM package (cargo generate-rpm). auto-req discovers libc/libgcc from ldd.
[package.metadata.generate-rpm]
name = "kemori"
assets = [
    { source = "target/release/kemori", dest = "/usr/bin/kemori", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/kemori/LICENSE", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kemori/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/kemori/CHANGELOG.md", mode = "644", doc = true },
    { source = "SECURITY.md", dest = "/usr/share/doc/kemori/SECURITY.md", mode = "644", doc = true },
    { source = "docs/*.md", dest = "/usr/share/doc/kemori/docs/", mode = "644", doc = true },
]
release = "1"
vendor = "Kemori contributors"
auto-req = "builtin"
